<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/flowbite/tokens.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-sans); background: #fff; display: flex; gap: var(--space-8); }
  .tile .caption { font-size: 12px; color: var(--gray-500); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-2); }
  .tile .value { font-size: 36px; line-height: 40px; font-weight: 700; color: var(--gray-900); margin-bottom: var(--space-2); }
  .tile a { font-size: 14px; color: var(--blue-600); text-decoration: none; }
  .tile a:hover { color: var(--blue-700); text-decoration: underline; }
</style>
</head>
<body>
  <div class="tile">
    <div class="caption">Open Alerts</div>
    <div class="value">53</div>
    <a href="#">View Alerts</a>
  </div>
  <div class="tile">
    <div class="caption">Closed Alerts</div>
    <div class="value">184</div>
  </div>
</body>
</html>
