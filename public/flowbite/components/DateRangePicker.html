<!-- @dsCard group="Forms" height=180 -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/flowbite/tokens.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-sans); background: #fff; }
  button { font-family: inherit; display: inline-flex; align-items: center; gap: var(--space-2); background: #fff; border: 1px solid var(--gray-300); border-radius: var(--radius-sm); padding: 10px var(--space-4); font-size: 14px; color: var(--gray-800); cursor: pointer; }
  button:hover { border-color: var(--gray-400); }
  button:focus-visible { outline: none; border-color: var(--violet-500); box-shadow: 0 0 0 4px var(--violet-100); }
  .cal { width: 14px; height: 14px; border: 1.5px solid var(--gray-500); border-radius: 2px; position: relative; }
  .cal::before, .cal::after { content: ""; position: absolute; top: -3px; width: 1.5px; height: 4px; background: var(--gray-500); }
  .cal::before { left: 3px; }
  .cal::after { right: 3px; }
  .chevron { font-size: 10px; color: var(--gray-400); margin-left: var(--space-1); }
</style>
</head>
<body>
  <button><span class="cal"></span> Jun 01, 2023 – May 31, 2024 <span class="chevron">▾</span></button>
</body>
</html>
