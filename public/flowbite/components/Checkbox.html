<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/flowbite/tokens.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--violet-600); }
  label { font-size: 14px; color: var(--gray-700); }
  .disabled label { color: var(--gray-400); cursor: not-allowed; }
</style>
</head>
<body>
  <div class="row"><input type="checkbox" id="c1"><label for="c1">Age band (unchecked, click it)</label></div>
  <div class="row"><input type="checkbox" id="c2" checked><label for="c2">Alert owner (checked)</label></div>
  <div class="row disabled"><input type="checkbox" id="c3" disabled><label for="c3">Alert status (disabled)</label></div>
</body>
</html>
