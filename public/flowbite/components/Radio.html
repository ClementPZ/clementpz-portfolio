<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/flowbite/tokens.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
  input[type="radio"] { width: 16px; height: 16px; accent-color: var(--blue-600); }
  label { font-size: 14px; color: var(--gray-700); }
  .disabled label { color: var(--gray-400); cursor: not-allowed; }
</style>
</head>
<body>
  <div class="row"><input type="radio" name="g" id="r1"><label for="r1">Themes (unselected, click a row)</label></div>
  <div class="row"><input type="radio" name="g" id="r2" checked><label for="r2">Theme groups (selected)</label></div>
  <div class="row"><input type="radio" name="g" id="r3"><label for="r3">Custom theme groups</label></div>
  <div class="row disabled"><input type="radio" name="g2" id="r4" disabled><label for="r4">Disabled option</label></div>
</body>
</html>
