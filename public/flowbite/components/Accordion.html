<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/flowbite/tokens.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-sans); background: #fff; max-width: 280px; }
  details { border-bottom: 1px solid var(--gray-200); padding: var(--space-3) 0; }
  summary { list-style: none; cursor: pointer; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: var(--gray-700); }
  summary::-webkit-details-marker { display: none; }
  summary > span:first-child { flex: 1; }
  .chevron { font-size: 10px; color: var(--gray-400); transition: transform .15s; }
  details[open] .chevron { transform: rotate(180deg); }
  .reset { font-size: 12px; color: var(--blue-600); text-decoration: none; margin-right: var(--space-2); }
  .panel { margin-top: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
  .panel label { font-size: 13px; color: var(--gray-700); display: flex; align-items: center; gap: var(--space-2); }
  input[type="checkbox"] { accent-color: var(--blue-600); }
</style>
</head>
<body>
  <details open>
    <summary><span>View By</span> <a class="reset" href="#">Reset</a> <span class="chevron">▾</span></summary>
    <div class="panel">
      <label><input type="checkbox" checked> Group by</label>
      <label><input type="checkbox"> Sort by</label>
    </div>
  </details>
  <details>
    <summary><span>Filters</span> <span class="chevron">▾</span></summary>
    <div class="panel">
      <label><input type="checkbox"> Age band</label>
      <label><input type="checkbox"> Alert owner</label>
    </div>
  </details>
</body>
</html>
